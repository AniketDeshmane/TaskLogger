name: Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install WiX Toolset
      run: dotnet tool install --global wix --version 4.0.5
      
    - name: Restore NuGet Packages
      run: dotnet restore
      
    - name: Build and Package using build.bat
      shell: cmd
      run: call "%GITHUB_WORKSPACE%\build.bat" --no-clean --installer-only
        
    - name: Create Release Packages
      shell: pwsh
      run: |
        Write-Host "Creating release packages..."
        
        # Version from pushed tag
        $version = "${{ github.ref_name }}"
        
        $versionClean = $version.TrimStart('v')
        
        # Create output directory
        New-Item -ItemType Directory -Path "./release" -Force | Out-Null
        
        # Copy the built installer
        if (Test-Path "./build/output/TaskLoggerSetup.msi") {
          Copy-Item -Path "./build/output/TaskLoggerSetup.msi" -Destination "./release/TaskLogger-$versionClean-Installer.msi"
          Write-Host "Installer copied to release directory"
        } else {
          Write-Error "TaskLoggerSetup.msi not found in build output!"
          exit 1
        }
        
        # Create portable package
        Write-Host "Creating portable package..."
        Compress-Archive -Path "./build/output/publish/*" -DestinationPath "./release/TaskLogger-$versionClean-Portable.zip" -Force
        
        Write-Host "Packages created successfully!"
        Get-ChildItem "./release" | ForEach-Object { Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

    - name: Generate Release Notes
      id: release_notes
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        
        $versionClean = $version.TrimStart('v')
        $date = Get-Date -Format "yyyy-MM-dd"
        
        $notes = "## Task Logger $versionClean`n`nReleased: $date`n`n### Installation Options`n`n1. **TaskLogger-$versionClean-Installer.msi** - Recommended for most users`n   - Standard Windows Installer`n   - Handles upgrades automatically`n   - No .NET runtime required`n`n2. **TaskLogger-$versionClean-Portable.zip** - Portable version`n   - No installation required`n   - No .NET runtime required`n   - Extract and run TaskLogger.exe directly`n`n### System Requirements`n`n- Windows 10/11 (64-bit)`n- No additional dependencies required (self-contained)`n`n### Installation Instructions`n`n**For Installer:**`n1. Download TaskLogger-$versionClean-Installer.msi`n2. Run the installer and follow the prompts`n`n**For Portable Package:**`n1. Download TaskLogger-$versionClean-Portable.zip`n2. Extract to your desired location`n3. Run TaskLogger.exe directly"
        
        echo "RELEASE_NOTES<<EOF" >> $env:GITHUB_OUTPUT
        echo $notes >> $env:GITHUB_OUTPUT
        echo "EOF" >> $env:GITHUB_OUTPUT
        
    - name: Create GitHub Release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v1
      with:
        name: Task Logger ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
        files: |
          ./release/TaskLogger-*-Installer.msi
          ./release/TaskLogger-*-Portable.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
